<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Solar Optimization | AI X ENV</title>
    <link rel="stylesheet" href="solar.css">
</head>

<body>
    <div class="sub-page-container">
        <header>
            <button onclick="window.location.href='index.html'">← Back</button>
            <h1>Solar ROI Dashboard</h1>
        </header>

        <main class="content-grid">
            <section class="roi-card">
                <h2>ROI Calculator</h2>
                <input type="number" id="panelCount" placeholder="Number of Panels">
                <button onclick="calculateROI()">Estimate Savings</button>
                <div id="roiResult"></div>
            </section>

            <section class="sunlight-tracker">
                <h2>Sunlight Tracker</h2>
                <div class="sun-icon">☀️</div>
                <p>Peak Sun Hours: 5.5h</p>
                <p>Energy Generated: <span id="energyVal">0</span> kWh</p>
            </section>
        </main>
    </div>
    <script src="solar.js"></script>
</body>

</html>
