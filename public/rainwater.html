<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Rainwater Harvesting | AI X ENV</title>
    <link rel="stylesheet" href="rainwater.css">
</head>

<body>
    <video autoplay muted loop id="bg-video">
        <source src="rainwater.mp4" type="video/mp4">
        Your browser does not support the video tag.
    </video>
    <div class="sub-page-container">
        <header>
            <button class="glass-btn back-btn" onclick="window.location.href='index.html'">← Back</button>
            <h1>Rainwater Harvesting</h1>
        </header>

        <main class="content-grid">
            <section class="calculator-card">
                <h2>Harvesting Calculator</h2>
                <input type="number" id="roofArea" placeholder="Roof Area (sq meters)">
                <input type="number" id="rainfall" placeholder="Avg Rainfall (mm)">
                <button onclick="calculateWater()">Calculate Yield</button>
                <div id="calcResult"></div>
            </section>

            <section class="visualizer">
                <h2>Live Metrics</h2>
                <div class="water-tracker">
                    <div id="waterLevel" class="fill"></div>
                </div>
                <p>Water Savings Tracker: <span id="savedLitres">0</span> Litres</p>
            </section>
        </main>
    </div>
    <section class="contribution-card">
        <h2>Show us how you saved & reused!</h2>
        <p>Upload a photo or video of your harvesting setup or reuse method to earn points.</p>

        <div class="upload-zone">
            <input type="file" id="rainProof" accept="image/*,video/*">
            <label for="rainProof" class="custom-file-upload">📁 Choose File</label>
            <p id="fileNameDisplay">No file chosen</p>
        </div>

        <button class="submit-btn" onclick="submitRainAction()">Submit to AI X ENV</button>
    </section>


    <script src="rainwater.js"></script>
</body>

</html>
