<body id="electricityBody">
    <div class="glass-container">
        <button class="back-btn" onclick="window.location.href='index.html'">←</button>
        <h1 class="neon-text">Energy Optimization</h1>

        <div class="meter-box">
            <div class="meter" id="liveMeter">000392.2 kWh</div>
            <p>Live Reading Simulation</p>
        </div>

        <div class="card bill-upload-section">
            <h3>Analyze Monthly Bill</h3>
            <p>Upload your TPCODL/Electricity bill for AI insights.</p>
            <input type="file" id="billInput" accept="image/*" onchange="analyzeBill()">
            <div id="uploadStatus"></div>
        </div>

        <div id="analysisPanel" class="card" style="display:none; border-left: 5px solid #0f0;">
            <h3>AI Usage Analysis</h3>
            <div id="analysisContent"></div>
            <div class="spike-graph" id="graph"></div>
        </div>
    </div>
    <div id="odometerSection" class="card" style="display:none; text-align:center;">
        <h3>Monthly Energy Journey</h3>
        <div class="odo-container">
            <span class="odo-label">PREV</span>
            <div id="prevOdo" class="meter-small">0000</div>
            <span class="arrow">➞</span>
            <div id="presOdo" class="meter-small odo-glow">0000</div>
            <span class="odo-label">PRES</span>
        </div>
        <p id="unitSummary" style="color:#00ff88; margin-top:10px;"></p>
    </div>

    <div id="smartInsights" class="content-grid" style="display:none; margin-top:20px;">
        <div class="glass-panel-yellow">
            <h4>⚡ Load Guard (CD: <span id="cdVal">0</span>)</h4>
            <p id="loadTip" style="font-size:0.85rem;"></p>
        </div>
        <div class="glass-panel-blue">
            <h4>🌊 Coastal Climate Tip</h4>
            <p id="climateTip" style="font-size:0.85rem;"></p>
        </div>
    </div>
    <script src="electricity.js"></script>
</body>
