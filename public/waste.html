<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Eco Waste Management | AI X ENV</title>
    <link rel="stylesheet" href="waste.css">
</head>

<body>
    <video autoplay muted loop id="bg-video">
        <source src="waste-bg.mp4" type="video/mp4">
    </video>

    <div class="sub-page-container">
        <header>
            <button class="glass-btn back-btn" onclick="window.location.href='index.html'">← Home</button>
            <h1 class="neon-title-green">Waste Diversion Hub</h1>
        </header>

        <main class="content-grid">
            <section class="glass-panel-green">
                <h2>Live Waste Metrics</h2>
                <div class="waste-counter">
                    <span id="totalGarbage">45.2</span> <small>kg</small>
                </div>
                <p>Net Garbage Dumped (Campus Total)</p>
                <div class="impact-alert">
                    "You prevented 2kg waste from landfill this week"
                </div>
            </section>

            <section class="glass-panel-green">
                <h2>Validate Your Disposal</h2>
                <p>Select bin type and upload proof to earn points.</p>

                <div class="bin-selector">
                    <button class="bin-btn organic" onclick="setBin('organic')">Organic</button>
                    <button class="bin-btn recycle" onclick="setBin('recyclable')">Recycle</button>
                    <button class="bin-btn hazard" onclick="setBin('hazardous')">Hazard</button>
                </div>

                <div class="upload-area">
                    <input type="file" id="wasteProof" accept="image/*" style="display:none">
                    <label for="wasteProof" class="glass-btn-upload">📸 Capture Proof</label>
                    <p id="fileStatus">No image selected</p>
                    <button class="submit-btn-green" onclick="validateWaste()">Verify & Earn</button>
                </div>
            </section>
        </main>
    </div>
    <script src="waste.js"></script>
</body>

</html>
